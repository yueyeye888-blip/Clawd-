mixed-port: 7890
allow-lan: false
mode: rule
log-level: info

proxies:
  - name: HK-HomeIP
    type: vless
    server: annei.top
    port: 443
    uuid: 8b7ac12f-4c1a-4db3-9d1a-7c9a5f3e6b21
    tls: true
    servername: annei.top
    network: ws
    ws-opts:
      path: /hkws
      headers:
        Host: annei.top
    udp: true

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - HK-HomeIP
      - DIRECT

rules:
  - MATCH,PROXY
